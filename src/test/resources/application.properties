# GPAS Test Configuration
# Maps to Docker Compose environment variables:
# EU_DATAMANAGEMENTUNIT_TRANSIT_GPAS_URL -> eu.datamanagementunit.transit.gpas.url
# EU_DATAMANAGEMENTUNIT_TRANSIT_GPAS_KEYCLOAK_ENABLE -> eu.datamanagementunit.transit.gpas.keycloak.enable
# EU_DATAMANAGEMENTUNIT_TRANSIT_GPAS_KEYCLOAK_CLIENT_ID -> eu.datamanagementunit.transit.gpas.keycloak.client.id
# EU_DATAMANAGEMENTUNIT_TRANSIT_GPAS_KEYCLOAK_CLIENT_SECRET -> eu.datamanagementunit.transit.gpas.keycloak.client.secret
# EU_DATAMANAGEMENTUNIT_TRANSIT_GPAS_KEYCLOAK_SERVER_URL -> eu.datamanagementunit.transit.gpas.keycloak.server.url
# EU_DATAMANAGEMENTUNIT_TRANSIT_GPAS_KEYCLOAK_REALM -> eu.datamanagementunit.transit.gpas.keycloak.realm

# For local testing (containers mapped to localhost)
eu.datamanagementunit.transit.gpas.url=http://localhost:8080/gpas
eu.datamanagementunit.transit.gpas.keycloak.enable=true
eu.datamanagementunit.transit.gpas.keycloak.client.id=gpas-domain-admin
eu.datamanagementunit.transit.gpas.keycloak.client.secret=domain-admin-client-secret
eu.datamanagementunit.transit.gpas.keycloak.server.url=http://localhost:8081
eu.datamanagementunit.transit.gpas.keycloak.realm=ttp